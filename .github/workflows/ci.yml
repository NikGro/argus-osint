name: ARGUS checks and release
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: ruff check .
      - run: black --check core plugins scripts tests server.py
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:check
      - run: python scripts/build_plugin_manifest.py --check
      - run: npm run test:frontend
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: argus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare test image with every research tool
        # The release image ships no tools; the test image installs all of them
        # with the production recipes into a read-only tool directory.
        run: |
          cat > Dockerfile.ci <<'EOF'
          FROM argus:ci
          USER root
          COPY requirements-test.txt /tmp/requirements-test.txt
          RUN pip install --no-cache-dir -r /tmp/requirements-test.txt
          ENV ARGUS_TOOLS_DIR=/opt/argus-tools
          RUN python -c "from core import tools; [tools.install(t, print) for t in tools.RECIPES]"
          USER workbench
          EOF
          docker build -f Dockerfile.ci -t argus-tests:ci .
      - name: Require integration dependencies in the test image
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python argus-tests:ci \
            -c "import shutil, subprocess; from core import tools; missing = [t for t in tools.RECIPES if not tools.installed(t)]; assert not missing, missing; subprocess.run([tools.python('holehe'), '-c', 'import holehe.core'], check=True); assert shutil.which('exiftool'), 'ExifTool missing from CI image'; print('All research tools installed')"
      - name: Complete offline Python and real Chromium suite
        id: python
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python -e DATA_DIR=/tmp/argus-test-data \
            -v "$PWD/tests:/app/tests:ro" -v "$PWD/plugins:/app/plugins:ro" argus-tests:ci \
            -m unittest discover -s /app/tests -v 2>&1 | tee artifacts/python-tests.log
      - name: Start the release image with the Compose permissions
        if: ${{ !cancelled() && (steps.python.outcome == 'success' || steps.python.outcome == 'failure') }}
        run: |
          docker run -d --name argus-smoke --user 0:0 --cap-drop ALL \
            --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SETUID --cap-add SETGID \
            --cap-add CHOWN --cap-add KILL --device /dev/net/tun \
            --security-opt no-new-privileges argus:ci
          healthy=0
          for attempt in $(seq 1 60); do
            if docker exec argus-smoke python -c "import json, urllib.request; h = json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)); assert h['queue_worker_alive'], h; print(h)"; then healthy=1; break; fi
            sleep 1
          done
          docker logs argus-smoke 2>&1 | tail -20
          test "$healthy" = 1
          # The application runs unprivileged; the image ships no tools or native plugins.
          docker exec argus-smoke sh -c 'test "$(stat -c %u /data/tools)" = 10001 && test ! -e /app/plugins/username.py'
          docker rm -f argus-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-validation
          path: artifacts/
  release:
    needs: [quality, runtime]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish ARGUS v26.10.4-beta.1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish validated beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v26.10.4-beta.1 --target "$GITHUB_SHA" --prerelease --title "ARGUS 26.10.4 Beta 1" --notes-file RELEASE_NOTES.md
