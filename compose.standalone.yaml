# Same as compose.yaml; kept for existing COMPOSE_FILE settings.
services:
  argus:
    build:
      context: .
      args:
        # Git revision whose plugin files match plugins/native.json in this
        # image. Empty means the release tag v<VERSION>.
        ARGUS_SOURCE_REF: ${ARGUS_SOURCE_REF:-}
    # Root only until the VPN controller runs; the application and every
    # plugin then run as UID 10001. No other privileges are needed.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, CHOWN, DAC_OVERRIDE, KILL]
    devices: [/dev/net/tun:/dev/net/tun]
    security_opt: [no-new-privileges:true]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - argus-data:/data
    environment:
      DATA_DIR: /data
      GEOCODER_URL: ${GEOCODER_URL:-}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-}
    shm_size: 1gb
    restart: unless-stopped

volumes:
  argus-data:
